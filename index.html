<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colourful Animated Login</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{
    height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(-45deg,#ff6a00,#ee0979,#00c6ff,#7b2ff7,#00f260);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    overflow:hidden;
  }
  @keyframes gradientBG{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  .bubble{
    position:absolute;border-radius:50%;
    background:rgba(255,255,255,.25);
    animation:float 8s ease-in-out infinite;
  }
  .bubble:nth-child(1){width:80px;height:80px;left:10%;top:15%}
  .bubble:nth-child(2){width:120px;height:120px;left:80%;top:10%;animation-delay:1s}
  .bubble:nth-child(3){width:60px;height:60px;left:70%;top:80%;animation-delay:2s}
  .bubble:nth-child(4){width:100px;height:100px;left:20%;top:80%;animation-delay:.5s}
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-30px)}
  }
  .card{
    position:relative;z-index:2;
    width:360px;padding:35px 30px;
    background:rgba(255,255,255,.92);
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    animation:slideIn .8s ease;
    text-align:center;
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateY(40px) scale(.95)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .logo{
    width:70px;height:70px;margin:0 auto 10px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:32px;color:white;
    background:linear-gradient(45deg,#ff6a00,#ee0979,#7b2ff7);
    animation:spin 6s linear infinite;
  }
  @keyframes spin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
  }
  h2{color:#333;margin-bottom:5px}
  p{color:#777;font-size:14px;margin-bottom:20px}
  .input-group{position:relative;margin-bottom:16px;text-align:left}
  .input-group label{font-size:13px;font-weight:600;color:#555}
  .input-group input{
    width:100%;padding:12px 40px 12px 12px;margin-top:5px;
    border:2px solid #eee;border-radius:12px;outline:none;
    font-size:15px;transition:.3s;background:#f9f9f9;
  }
  .input-group input:focus{
    border-color:#7b2ff7;background:white;
    box-shadow:0 0 0 4px rgba(123,47,247,.15);
    transform:scale(1.02);
  }
  .eye{position:absolute;right:12px;top:34px;cursor:pointer;font-size:18px}
  .btn{
    width:100%;padding:13px;border:none;border-radius:12px;
    color:white;font-size:16px;font-weight:700;cursor:pointer;
    background:linear-gradient(90deg,#ff6a00,#ee0979,#7b2ff7,#00c6ff);
    background-size:300% 100%;
    transition:.4s;
  }
  .btn:hover{
    background-position:100% 0;
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(238,9,121,.35);
  }
  .btn:active{transform:scale(.98)}
  .row{display:flex;justify-content:space-between;font-size:13px;margin:14px 0}
  .row a{color:#ee0979;text-decoration:none;font-weight:600}
  .row a:hover{text-decoration:underline}
  .divider{margin:18px 0;color:#aaa;font-size:13px;position:relative}
  .divider::before,.divider::after{
    content:"";position:absolute;top:50%;width:38%;height:1px;background:#ddd;
  }
  .divider::before{left:0}.divider::after{right:0}
  .social{display:flex;gap:10px}
  .social button{
    flex:1;padding:10px;border:1px solid #eee;border-radius:10px;
    background:white;cursor:pointer;font-weight:600;transition:.3s;
  }
  .social button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.1)}
  #msg{margin-top:12px;font-size:14px;font-weight:600;min-height:20px}
  .success{color:green;animation:pop .4s ease}
  .error{color:#ee0979;animation:shake .4s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
  }
  @keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
  .signup{margin-top:16px;font-size:14px;color:#555}
  .signup a{color:#7b2ff7;font-weight:700;text-decoration:none}
</style>
</head>
<body>

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<div class="card">
  <div class="logo">✦</div>
  <h2>Welcome Back!</h2>
  <p>Login to continue your colourful journey</p>

  <form id="loginForm">
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      <span class="eye" id="toggleEye">👁️</span>
    </div>

    <div class="row">
      <label><input type="checkbox" checked> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn" type="submit">Login →</button>
    <div id="msg"></div>
  </form>

  <div class="divider">or continue with</div>
  <div class="social">
    <button onclick="socialLogin('Google')">🔍 Google</button>
    <button onclick="socialLogin('Facebook')">📘 Facebook</button>
  </div>

  <div class="signup">Don't have an account? <a href="#">Sign Up</a></div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const pass = document.getElementById('password');
  const eye = document.getElementById('toggleEye');

  eye.addEventListener('click', () => {
    if(pass.type === 'password'){
      pass.type = 'text';
      eye.textContent = '🙈';
    } else {
      pass.type = 'password';
      eye.textContent = '👁️';
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = pass.value.trim();

    if(!email.includes('@') || password.length < 6){
      msg.textContent = '❌ Please enter valid email & 6+ char password';
      msg.className = 'error';
      return;
    }

    msg.textContent = '⏳ Logging you in...';
    msg.className = '';
    msg.style.color = '#7b2ff7';

    setTimeout(() => {
      msg.textContent = '✅ Login Successful! Welcome 🎉';
      msg.className = 'success';
    }, 1000);
  });

  function socialLogin(name){
    msg.textContent = `🔗 Connecting with ${name}...`;
    msg.style.color = '#333';
  }
</script>

</body>
</html>
